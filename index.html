
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomaly Time Series Viewer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(10px);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .upload-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .file-input {
            background: rgba(255, 255, 255, 0.2);
            border: 2px dashed #fff;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .file-input:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-5px);
        }
        input[type="file"] {
            display: none;
        }
        .file-label {
            cursor: pointer;
            display: block;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            background: #fff;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            min-width: 150px;
        }
        .stat h3 {
            margin: 0 0 10px 0;
            font-size: 1.2em;
        }
        .stat p {
            margin: 0;
            font-size: 1.5em;
            font-weight: bold;
        }
        .anomaly-list {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
        }
        .anomaly-list h2 {
            margin-top: 0;
            text-align: center;
        }
        .anomaly-item {
            background: rgba(255, 255, 255, 0.2);
            margin: 5px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        .btn.active {
            background: #4CAF50;
        }
        .clear-btn {
            background: #F44336;
        }
        .clear-btn:hover {
            background: #D32F2F;
        }
        .detect-btn {
            background: #FF9800;
        }
        .train-btn {
            background: #4CAF50;
        }
        .train-btn:hover {
            background: #388E3C;
        }
        .detect-btn:hover {
            background: #F57C00;
        }
        #timeRangeSlider {
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Anomaly Time Series Viewer</h1>
        <div class="upload-section">
            <div class="file-input">
                <input type="file" id="datasetFile" accept=".jsonl">
                <label for="datasetFile" class="file-label">
                    <strong>Upload Dataset (.jsonl)</strong><br>
                    Choose your time series data file
                </label>
            </div>
            <div class="file-input">
                <input type="file" id="metadataFile" accept=".json">
                <label for="metadataFile" class="file-label">
                    <strong>Upload Metadata (.json)</strong><br>
                    Choose your anomalies metadata file
                </label>
            </div>
        </div>
        <div class="controls">
            <div class="control-group">
                <label><strong>Granularity:</strong></label>
                <button id="minuteBtn" class="btn active">Minute Wise</button>
                <button id="hourBtn" class="btn">Hour Wise</button>
            </div>
            <div class="control-group">
                <label><strong>Time Range:</strong></label>
                <input type="range" id="timeRangeSlider" min="0" max="100" value="100">
                <span id="timeRangeValue">100%</span>
            </div>
            <div class="control-group">
                <button id="trainBtn" class="btn train-btn">Train Model</button>
                <button id="detectBtn" class="btn detect-btn">Detect Anomalies</button>
                <button id="clearBtn" class="btn clear-btn">Clear Metadata</button>
            </div>
        </div>
        <canvas id="chart" width="1000" height="500" style="max-width: 100%; height: auto;"></canvas>
        <div class="stats" id="stats" style="display: none;">
            <div class="stat">
                <h3>Total Points</h3>
                <p id="totalPoints">0</p>
            </div>
            <div class="stat">
                <h3>Anomalies</h3>
                <p id="anomalyCount">0</p>
            </div>
            <div class="stat">
                <h3>Time Range</h3>
                <p id="timeRange">N/A</p>
            </div>
        </div>
        <div class="anomaly-list" id="anomalyList" style="display: none;">
            <h2>Detected Anomalies</h2>
            <div id="anomalyItems"></div>
        </div>
    </div>
    <script>
        let dataset = [];
        let anomalies = new Set();
        let granularity = 'minute'; // 'minute' or 'hour'
        let timeRangePercent = 100;

        document.getElementById('datasetFile').addEventListener('change', handleDatasetUpload);
        document.getElementById('metadataFile').addEventListener('change', handleMetadataUpload);
        document.getElementById('minuteBtn').addEventListener('click', () => setGranularity('minute'));
        document.getElementById('hourBtn').addEventListener('click', () => setGranularity('hour'));
        document.getElementById('timeRangeSlider').addEventListener('input', handleTimeRangeChange);
        document.getElementById('trainBtn').addEventListener('click', trainModel);
        document.getElementById('detectBtn').addEventListener('click', detectAnomalies);
        document.getElementById('clearBtn').addEventListener('click', clearMetadata);

        function handleDatasetUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const content = e.target.result;
                    dataset = content.trim().split('\n').map(line => JSON.parse(line));
                    dataset.sort((a, b) => a.timestamp - b.timestamp);
                    updateDisplay();
                };
                reader.readAsText(file);
            }
        }

        function handleMetadataUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const content = e.target.result;
                    const metadata = JSON.parse(content);
                    anomalies = new Set(metadata.map(a => `${a.timestamp},${a.entity_id},${a.metric}`));
                    updateDisplay();
                };
                reader.readAsText(file);
            }
        }

        function setGranularity(newGranularity) {
            granularity = newGranularity;
            document.getElementById('minuteBtn').classList.toggle('active', granularity === 'minute');
            document.getElementById('hourBtn').classList.toggle('active', granularity === 'hour');
            updateDisplay();
        }

        function handleTimeRangeChange(event) {
            timeRangePercent = parseInt(event.target.value);
            document.getElementById('timeRangeValue').textContent = timeRangePercent + '%';
            updateDisplay();
        }

        function clearMetadata() {
            anomalies.clear();
            updateDisplay();
            alert('Metadata cleared!');
        }

        async function trainModel() {
            if (dataset.length === 0) {
                alert('Please upload dataset first!');
                return;
            }

            try {
                // Check if API server is running
                const statusResponse = await fetch('http://localhost:8001/status');
                if (!statusResponse.ok) {
                    alert('API server not running. Please start the API server with: python3 api_server.py (runs on port 8001)');
                    return;
                }

                alert('Training HTM and LSM models on API server...');

                // Send training data to API
                const trainResponse = await fetch('http://localhost:8001/train', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: dataset })
                });

                if (!trainResponse.ok) {
                    const error = await trainResponse.text();
                    alert('Training failed: ' + error);
                    return;
                }

                alert('Model trained successfully!');

            } catch (error) {
                alert('Error communicating with API server: ' + error.message);
            }
        }

        async function detectAnomalies() {
            if (dataset.length === 0) {
                alert('Please upload dataset and train the model first!');
                return;
            }

            try {
                // Check if API server is running
                const statusResponse = await fetch('http://localhost:8001/status');
                const statusData = await statusResponse.json();
                if (statusData.status !== 'trained') {
                    alert('Model not trained. Please train the model first using the Train Model button.');
                    return;
                }

                alert('Detecting anomalies...');

                // Detect anomalies for each data point
                const detectedAnomalies = [];
                for (const point of dataset) {
                    const detectResponse = await fetch('http://localhost:8001/detect', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ point: point })
                    });

                    if (detectResponse.ok) {
                        const result = await detectResponse.json();
                        if (result.anomaly_flag) {
                            detectedAnomalies.push(point);
                        }
                    }
                }

                // Update anomalies
                anomalies.clear();
                detectedAnomalies.forEach(a => {
                    const key = `${a.timestamp},${a.entity_id},${a.metric}`;
                    anomalies.add(key);
                });

                updateDisplay();
                alert(`Anomaly detection complete! Found ${detectedAnomalies.length} anomalies.`);

            } catch (error) {
                alert('Error communicating with API server: ' + error.message);
            }
        }



        function computeStatistics(data) {
            const entityStats = {};

            data.forEach(d => {
                const key = `${d.entity_id}-${d.metric}`;
                if (!entityStats[key]) {
                    entityStats[key] = { values: [], mean: 0, std: 0 };
                }
                entityStats[key].values.push(d.value);
            });

            Object.keys(entityStats).forEach(key => {
                const values = entityStats[key].values;
                const mean = values.reduce((a, b) => a + b, 0) / values.length;
                const variance = values.reduce((a, b) => a + (b - mean) ** 2, 0) / values.length;
                const std = Math.sqrt(variance);
                entityStats[key].mean = mean;
                entityStats[key].std = std;
            });

            return entityStats;
        }

        function detectAnomalies(data, stats) {
            const anomalies = [];
            const threshold = 3; // Z-score threshold

            data.forEach(d => {
                const key = `${d.entity_id}-${d.metric}`;
                const stat = stats[key];
                if (stat && stat.std > 0) {
                    const zScore = Math.abs((d.value - stat.mean) / stat.std);
                    if (zScore > threshold) {
                        anomalies.push(d);
                    }
                }
            });

            return anomalies;
        }

        function updateDisplay() {
            if (dataset.length > 0) {
                drawChart();
                updateStats();
                updateAnomalyList();
                document.getElementById('stats').style.display = 'flex';
                document.getElementById('anomalyList').style.display = 'block';
            }
        }

        function aggregateData(data, granularity) {
            if (granularity === 'minute') return data;

            // Aggregate to hourly
            const hourlyData = [];
            const hourMap = new Map();

            data.forEach(d => {
                const hour = Math.floor(d.timestamp / 3600) * 3600; // Round to hour
                const key = `${d.entity_id}-${d.signal_type}-${d.metric}-${hour}`;
                if (!hourMap.has(key)) {
                    hourMap.set(key, { values: [], timestamp: hour, entity_id: d.entity_id, signal_type: d.signal_type, metric: d.metric });
                }
                hourMap.get(key).values.push(d.value);
            });

            hourMap.forEach(entry => {
                const avgValue = entry.values.reduce((a, b) => a + b, 0) / entry.values.length;
                hourlyData.push({ ...entry, value: avgValue });
            });

            return hourlyData.sort((a, b) => a.timestamp - b.timestamp);
        }

        function filterByTimeRange(data, percent) {
            if (percent >= 100) return data;

            const minTime = Math.min(...data.map(d => d.timestamp));
            const maxTime = Math.max(...data.map(d => d.timestamp));
            const range = maxTime - minTime;
            const newMaxTime = minTime + (range * percent / 100);

            return data.filter(d => d.timestamp <= newMaxTime);
        }

        function drawChart() {
            const canvas = document.getElementById('chart');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            // Clear canvas
            ctx.clearRect(0, 0, width, height);

            if (dataset.length === 0) return;

            let displayData = aggregateData(dataset, granularity);
            displayData = filterByTimeRange(displayData, timeRangePercent);

            if (displayData.length === 0) return;

            // Find min max
            let minTime = Infinity, maxTime = -Infinity, minVal = Infinity, maxVal = -Infinity;
            displayData.forEach(d => {
                minTime = Math.min(minTime, d.timestamp);
                maxTime = Math.max(maxTime, d.timestamp);
                minVal = Math.min(minVal, d.value);
                maxVal = Math.max(maxVal, d.value);
            });

            // Scale functions
            const scaleX = (t) => ((t - minTime) / (maxTime - minTime)) * (width - 60) + 30;
            const scaleY = (v) => height - 30 - ((v - minVal) / (maxVal - minVal)) * (height - 60);

            // Draw axes
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(30, 30);
            ctx.lineTo(30, height - 30);
            ctx.lineTo(width - 30, height - 30);
            ctx.stroke();

            // Draw grid
            ctx.strokeStyle = '#eee';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 10; i++) {
                const x = 30 + (i / 10) * (width - 60);
                const y = 30 + (i / 10) * (height - 60);
                ctx.beginPath();
                ctx.moveTo(x, height - 30);
                ctx.lineTo(x, 30);
                ctx.moveTo(30, y);
                ctx.lineTo(width - 30, y);
                ctx.stroke();
            }

            // Draw data line
            ctx.strokeStyle = '#4CAF50';
            ctx.lineWidth = 2;
            ctx.beginPath();
            displayData.forEach((d, i) => {
                const x = scaleX(d.timestamp);
                const y = scaleY(d.value);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // Draw anomalies
            ctx.fillStyle = '#F44336';
            displayData.forEach(d => {
                const key = `${d.timestamp},${d.entity_id},${d.metric}`;
                if (anomalies.has(key)) {
                    const x = scaleX(d.timestamp);
                    const y = scaleY(d.value);
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, 2 * Math.PI);
                    ctx.fill();
                    // Add glow effect
                    ctx.shadowColor = '#F44336';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });

            // Add labels
            ctx.fillStyle = '#333';
            ctx.font = '12px Arial';
            ctx.fillText(new Date(minTime * 1000).toLocaleString(), 30, height - 10);
            ctx.fillText(new Date(maxTime * 1000).toLocaleString(), width - 200, height - 10);
            ctx.save();
            ctx.translate(10, height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('Value', 0, 0);
            ctx.restore();
            ctx.fillText('Time', width / 2, height - 5);
        }

        function updateStats() {
            let displayData = aggregateData(dataset, granularity);
            displayData = filterByTimeRange(displayData, timeRangePercent);
            document.getElementById('totalPoints').textContent = displayData.length;
            document.getElementById('anomalyCount').textContent = [...anomalies].length;
            if (displayData.length > 0) {
                const minTime = Math.min(...displayData.map(d => d.timestamp));
                const maxTime = Math.max(...displayData.map(d => d.timestamp));
                const duration = (maxTime - minTime) / 3600; // hours
                document.getElementById('timeRange').textContent = `${duration.toFixed(1)} hours`;
            }
        }

        function updateAnomalyList() {
            const container = document.getElementById('anomalyItems');
            container.innerHTML = '';
            const anomalyData = dataset.filter(d => anomalies.has(`${d.timestamp},${d.entity_id},${d.metric}`));
            anomalyData.forEach(a => {
                const div = document.createElement('div');
                div.className = 'anomaly-item';
                div.innerHTML = `
                    <strong>Entity ID:</strong> ${a.entity_id}<br>
                    <strong>Entity Type:</strong> ${a.entity_type || 'Unknown'}<br>
                    <strong>Signal Type:</strong> ${a.signal_type} - <strong>Metric:</strong> ${a.metric}<br>
                    <strong>Time:</strong> ${new Date(a.timestamp * 1000).toLocaleString()}<br>
                    <strong>Value:</strong> ${a.value ? a.value.toFixed(2) : 'N/A'}
                `;
                container.appendChild(div);
            });
        }

        // Make canvas responsive
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('chart');
            canvas.width = Math.min(1000, window.innerWidth - 40);
            if (dataset.length > 0) drawChart();
        });
    </script>
</body>
</html>
